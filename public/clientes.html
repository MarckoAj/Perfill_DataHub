<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes Operacionais - Perfill</title>

    <!-- Auth Guard imediato -->
    <script>
        (function () {
            if (!localStorage.getItem('authToken')) {
                window.location.replace('/login.html');
            }
        })();
    </script>

    <!-- CSS Global e CSS da Página -->
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/clientes.css" />
    <link rel="stylesheet" href="/css/point-modal.css" />
    <link rel="stylesheet" href="/css/new-point-model.css" />

    <link rel="stylesheet" href="/css/clientes-perfill.css?v=20261117-2" />
    <script defer src="/js/hub-client-modal.js"></script>
    <script defer src="/js/clientes.js?v=20261119-search-enter"></script>
<link rel="stylesheet" href="/css/perfill-shared.css">
</head>

<body class="clientes-perfill">

    <!-- NAVBAR GLOBAL -->
    <nav class="global-nav">
        <div class="nav-left">
            <div class="nav-logo">
                <div class="perfill-wordmark">perfill<span>DATA HUB</span></div>
            </div>
            <div class="nav-menu">
                <div class="nav-item">
                    <a href="/noc" class="nav-link">NOC</a>
                </div>
                <div class="nav-item">
                    <a href="/alerts" class="nav-link">Alertas</a>
                </div>
                <div class="nav-item">
                    <a href="/tickets" class="nav-link">Chamados</a>
                </div>
                <div class="nav-item">
                    <a href="/clientes" class="nav-link active">Clientes</a>
                </div>
                <div class="nav-item">
                    <a class="nav-link">Admin ▾</a>
                    <div class="nav-dropdown">
                        <a href="/admin/sync" class="dropdown-link">Sincronização</a>
                        <a href="/admin/tags" class="dropdown-link">Configuração e Cadastro de Tags</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="nav-right">

            <div class="nav-item">
                <button type="button" class="nav-link logout-link" onclick="doLogout()" aria-label="Sair do sistema">Sair</button>
            </div>
        </div>
    </nav>

    <!-- PAGE -->
    <main class="page-wrapper">

        <!-- CONTENT -->
        <section class="content-area">

            <!-- FILTERS -->
            <div class="filters-row">
                <input type="search" placeholder="Buscar por nome, código ou ID..." aria-label="Buscar por nome, código ou ID" class="filter-input" id="searchAsset" />

                <select class="filter-select" id="filterCoordinates" aria-label="Coordenadas">
                    <option value="all">Coordenadas: Todas</option>
                    <option value="complete">Coordenadas: Completas</option>
                    <option value="incomplete">Coordenadas: Incompletas</option>
                    <option value="missing">Coordenadas: Ausentes</option>
                </select>

                <div class="tag-filter-panel" id="hubTagFilters">
                    <div class="tag-filter-empty">Carregando tags...</div>
                </div>
            </div>

            <details class="hub-columns-picker"><summary>Colunas</summary><div id="hubColumnOptions"></div><button type="button" id="hubResetColumns" class="tag-filter-show-all">Restaurar colunas padrão</button></details>

            <!-- MAIN GRID -->
            <div class="main-grid">

                <!-- TABLE -->
                <div class="table-card">
                    <div class="hub-pagination" data-pagination="top"></div>
                    <div class="hub-table-scroll"><table class="hub-operational-table">
                        <thead>
                            <tr id="hubColumnHeaders"></tr>
                        </thead>
                        <tbody id="assetsTableBody">
                            <!-- Injetado via JS -->
                        </tbody>
                    </table></div>
                    <div class="hub-pagination" data-pagination="bottom"></div>
                </div>

            </div>

        </section>

    </main>

    <!-- Logout handler fallback -->
    <script>
        function doLogout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            window.location.replace('/login.html');
        }
    </script>

    <!-- MODAL PONTO/CLIENTE -->
    <div class="point-modal-overlay" id="pointModalOverlay">
        <div class="point-modal" role="dialog" aria-modal="true" aria-label="Ficha do cliente ou ponto">
            <!-- Header preenchido dinamicamente pelo JS (_renderHeader) -->
            <div class="point-modal-header"></div>
            <div class="point-modal-content">
                <div id="pointTabContent"></div>
            </div>
        </div>
    </div>

    <script src="/js/client-mock.js"></script>
    <script src="/js/new-point-model.js?v=20261117"></script>
    <script src="/js/glpi-point-history.js"></script>
<script src="/js/perfill-navigation.js"></script>
</body>

</html>
