<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Regras - DataHub</title>
  <link rel="stylesheet" href="css/index.css">
  <style>
    body {
      padding-top: 60px; /* offset da navbar global */
    }
    
    .page-container {
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .rule-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .rule-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      border-color: rgba(255,255,255,0.1);
    }

    .rule-header {
      padding: 20px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-icon {
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
    }

    .rule-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      line-height: 1.2;
    }

    .rule-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      margin: 0;
    }

    .rule-body {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .rule-code-block {
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }

    .block-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .code-value {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
      color: #e2e8f0;
      word-break: break-all;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 15px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-value {
      font-weight: 600;
      font-size: 14px;
      color: #f8fafc;
    }

    .sev-3 .rule-header { background: linear-gradient(135deg, rgba(239, 68, 68, 0.8), rgba(153, 27, 27, 0.9)); } /* Crítico */
    .sev-2 .rule-header { background: linear-gradient(135deg, rgba(245, 158, 11, 0.8), rgba(180, 83, 9, 0.9)); } /* Atenção */
    .sev-1 .rule-header { background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(30, 64, 175, 0.9)); } /* Informativo */
    .sev-0 .rule-header { background: linear-gradient(135deg, rgba(100, 116, 139, 0.8), rgba(51, 65, 85, 0.9)); } /* Default */

  </style>
</head>
<body>

  <!-- NAVBAR GLOBAL -->
  <nav class="global-nav">
    <div class="nav-left">
      <div class="nav-logo">
        <img src="/images/perfill_logo.png" alt="Perfill Logo" onerror="this.src=''">
      </div>
      <div class="nav-menu">
        <div class="nav-item">
          <a href="/noc" class="nav-link">NOC</a>
        </div>
        <div class="nav-item">
          <a href="/alerts" class="nav-link">Alertas</a>
        </div>
        <div class="nav-item">
          <a href="/tickets" class="nav-link">Chamados</a>
        </div>
        <div class="nav-item">
          <a href="/rules.html" class="nav-link active">Motor de Regras</a>
        </div>
        <div class="nav-item">
          <a class="nav-link">Admin ▾</a>
          <div class="nav-dropdown">
            <a href="/admin/sync" class="dropdown-link">Sincronização</a>
          </div>
        </div>
      </div>
    </div>

    <div class="nav-right">
      <button class="btn-refresh-nav" onclick="loadRules()">↻ Atualizar</button>
      <div class="nav-item">
        <a class="nav-link logout-link" onclick="doLogout()" title="Sair do sistema">⏻ Sair</a>
      </div>
    </div>
  </nav>

  <script>
    function doLogout() {
      localStorage.removeItem('authToken');
      window.location.replace('/login.html');
    }
  </script>

  <div class="page-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <h1 style="font-size:28px; margin:0 0 8px 0; color:#fff;">Catálogo de Regras</h1>
        <p style="color:var(--text-muted); margin:0;">Visualize todas as regras ativas na Rule Engine que monitoram os sistemas integrados.</p>
      </div>
      <div>
        <button onclick="loadRules()" style="background:var(--primary); color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:600;">↻ Atualizar Catálogo</button>
      </div>
    </div>

    <div class="rules-grid" id="rulesGrid">
      <!-- Carregado via JS -->
      <div style="color: #94a3b8;">Carregando regras...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('authToken');
    if (!token) window.location.replace('/login.html');

    const severityMap = {
      1: { label: 'Informativo', icon: '🔵', class: 'sev-1' },
      2: { label: 'Atenção', icon: '🟠', class: 'sev-2' },
      3: { label: 'Crítico', icon: '🔴', class: 'sev-3' }
    };

    async function loadRules() {
      const grid = document.getElementById('rulesGrid');
      grid.innerHTML = '<div style="color: #94a3b8;">Carregando regras...</div>';

      try {
        const response = await fetch('/api/rules', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();

        if (!data.success) throw new Error('Falha ao carregar regras');

        if (data.rules.length === 0) {
          grid.innerHTML = '<div style="color: #94a3b8;">Nenhuma regra encontrada na Engine.</div>';
          return;
        }

        grid.innerHTML = data.rules.map(rule => {
          const sevInfo = severityMap[rule.severity] || { label: 'Desconhecida', icon: '⚪', class: 'sev-0' };
          
          return `
            <div class="rule-card ${sevInfo.class}">
              <div class="rule-header">
                <div class="header-icon">${sevInfo.icon}</div>
                <h2 class="rule-title">${rule.name}</h2>
                <p class="rule-desc">${rule.description}</p>
              </div>
              <div class="rule-body">
                <div class="rule-code-block">
                  <div class="block-label">Código da Regra</div>
                  <div class="code-value">${rule.code}</div>
                </div>
                
                <div class="meta-grid">
                  <div class="meta-item">
                    <span class="block-label" style="color: var(--red);">Severidade</span>
                    <span class="meta-value" style="color: var(--red);">${sevInfo.label}</span>
                  </div>
                  <div class="meta-item">
                    <span class="block-label" style="color: var(--primary);">Origem</span>
                    <span class="meta-value" style="color: var(--primary);">${rule.source}</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div style="color: #ef4444;">Erro ao carregar regras: ${err.message}</div>`;
      }
    }

    // Carrega inicial
    loadRules();
  </script>
</body>
</html>
